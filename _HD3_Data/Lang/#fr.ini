<LC_LobbyRules> = "Règles d'utilisation des salons publics et des moyens de création de messages publics (inclut les messages de chat, les descriptions de partie et les pseudos). Ces règles ne s'appliquent pas aux messages privés ni à l'éthique en jeu.
Les actions suivantes sont strictement interdites :
1. Utiliser un vocabulaire obscène, harceler, menacer ou provoquer d'autres utilisateurs.
2. Publier des messages sans signification ou hors du thème du salon, ainsi que le flood ou l'abus de mise en forme du texte.
3. Utiliser une langue différente de celle du salon sélectionné (l'anglais est autorisé dans tous les salons en cas de nécessité).
4. Faire de la publicité.
5. Partager des liens dangereux ou menant vers des contenus offensants, provocateurs ou obscènes (pornographie, images choquantes, etc.).
6. Juger publiquement et/ou entraver les actions des administrateurs.

En cas de non-respect de ces règles, les administrateurs peuvent appliquer les sanctions suivantes :
- Censure des messages existants ou des descriptions de partie de l'utilisateur.
- Statut lecture-seule : l'utilisateur ne peut plus envoyer de nouveaux messages ni modifier les descriptions de partie.
- Blocage du compte utilisateur.
- Bannissement définitif du lobby.
Les administrateurs se réservent le droit d’appliquer ces sanctions à leur discrétion pour préserver un environnement respectueux."

{RC 22}

